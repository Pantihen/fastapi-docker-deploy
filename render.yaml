# Render Blueprint: приложение + PostgreSQL на бесплатном тарифе.
# Redis — существующий бесплатный Key Value аккаунта (адрес задаётся в REDIS_URL).
# Деплой: Render Dashboard → New → Blueprint → выбрать этот репозиторий → Apply.

services:
  - type: web
    name: fastapi-docker-deploy
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # На бесплатном тарифе нет Background Worker, поэтому Celery-воркер запускается
    # в том же контейнере, что и API (--pool=solo — один процесс, экономит память).
    # Uvicorn слушает $PORT, который задаёт Render.
    dockerCommand: >-
      sh -c "celery -A app.celery_app worker --loglevel=info --pool=solo &
      exec uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Внутренние адреса сервисов Render (аналог имён сервисов в docker compose)
      - key: DATABASE_URL
        fromDatabase:
          name: fastapi-db
          property: connectionString
      # Бесплатный Key Value на аккаунте Render только один, и он уже занят другим проектом,
      # поэтому используем его же: Internal URL вставляется в Dashboard (в репозиторий не попадает).
      # Этот проект пишет в отдельные базы Redis 2 и 3, чтобы не пересекаться с другим.
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_DB
        value: "2"
      - key: CELERY_RESULT_DB
        value: "3"
      - key: SECRET_KEY
        generateValue: true
      # Публичный адрес сервиса (RENDER_EXTERNAL_URL) добавляется в CORS автоматически
      - key: CORS_ORIGINS
        value: http://localhost:3000
      - key: ADMIN_EMAIL
        value: admin@example.com
      # Значение спросит Render при создании Blueprint — в репозиторий пароль не попадает
      - key: ADMIN_PASSWORD
        sync: false
      - key: EMAIL_SEND_DELAY_SECONDS
        value: "10"

databases:
  - name: fastapi-db
    plan: free
    region: frankfurt
    databaseName: app_db
    user: app
    ipAllowList: []  # доступ только из внутренней сети Render
